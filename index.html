<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Blood Slayers</title>
  <style>
    /* The canvas always fills the window; the game letterboxes itself to a 16:9 or 21:9 stage
       inside it (black bars drawn by the engine), so the page around it is black too. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; inset: 0; background: #000; }
    #olbaid-canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; background: #000; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: rgba(3,3,4,0.92); color: #d9c49a; font-family: Georgia, serif; letter-spacing: 0.1em; z-index: 20; text-align: center; padding: 24px; }
    #rotate .icon { font-size: 54px; animation: tilt 2.2s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate.on { display: flex; } }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: radial-gradient(ellipse at center, #1a0d08 0%, #030304 70%);
      font-family: Georgia, "Times New Roman", serif; color: #d9c49a; letter-spacing: 0.12em; z-index: 10;
      transition: opacity 0.6s ease;
    }
    #loader h1 { margin: 0; font-size: clamp(34px, 8vw, 64px); text-align: center; color: #b81b10; text-shadow: 0 4px 0 #000, 0 0 24px #5a0a05; }
    #bar { width: min(420px, 70vw); height: 6px; background: #120a07; border: 1px solid #5c4526; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8a5a1c, #e0b45a); transition: width 0.2s; }
    #msg { font-size: 14px; color: #8c7b62; max-width: 560px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="game"><canvas id="olbaid-canvas" tabindex="0"></canvas></div>
  <div id="rotate" class="on"><div class="icon">📱</div><div>Turn your phone sideways<br><small style="opacity:.6">tap to play in portrait anyway</small></div></div>
  <div id="loader">
    <h1>Blood Slayers</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Descending into the Ossuary&hellip;</div>
  </div>
  <script>
    // iOS: block pinch/double-tap zoom gestures inside the game.
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => e.preventDefault());
    document.getElementById("rotate").addEventListener("click", (e) => e.currentTarget.classList.remove("on"));
    // Browsers (iOS especially) start audio suspended until a user gesture: resume every
    // AudioContext the engine creates on the first touch/click/key.
    (function () {
      const ctxs = [];
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const Patched = function (...a) { const c = new AC(...a); ctxs.push(c); return c; };
      Patched.prototype = AC.prototype;
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;
      const unlock = () => { ctxs.forEach((c) => { if (c.state !== "running") c.resume().catch(() => {}); }); };
      ["touchend", "pointerup", "keydown", "click"].forEach((ev) => document.addEventListener(ev, unlock, { capture: true, passive: true }));
    })();
  </script>
  <script type="module">
    // Local testing: ?mock=1 installs a fake Wavedash SDK so several tabs/iframes can play together.
    if (new URLSearchParams(location.search).has("mock") && !window.Wavedash) {
      await import("./mock-wavedash.js");
    }
    const loader = document.getElementById("loader");
    const fill = document.getElementById("fill");
    const msg = document.getElementById("msg");
    // Called from Rust (src/web.rs) alongside the Wavedash SDK.
    window.olbaidProgress = (p) => { fill.style.width = `${Math.round(p * 100)}%`; };
    window.olbaidReady = () => {
      loader.style.opacity = "0";
      setTimeout(() => loader.remove(), 700);
      document.getElementById("olbaid-canvas").focus();
    };

    if (!navigator.gpu) {
      msg.innerHTML = "Blood Slayers renders with <b>WebGPU</b>, which this browser doesn't support.<br>" +
        "Please use a current Chrome, Edge or Safari (macOS 26+), or Firefox with WebGPU enabled.";
      fill.style.width = "0%";
    } else {
      // Report the (large) wasm download as the first slice of the progress bar.
      window.olbaidProgress(0.02);
      import("./olbaid.js")
        .then(async (m) => {
          try {
            await m.default();
          } catch (e) {
            // winit drives the browser event loop by throwing; that's expected.
            if (!String(e).includes("Using exceptions for control flow")) {
              console.error(e);
              msg.textContent = "Failed to start: " + e;
            }
          }
        })
        .catch((e) => { console.error(e); msg.textContent = "Failed to load: " + e; });
    }
  </script>
</body>
</html>
